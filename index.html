<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="description" content="A modern task manager application to organize your daily tasks">
    <meta name="theme-color" content="#6366f1">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Task Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <h1>Task Manager</h1>
                <button 
                    id="theme-toggle" 
                    class="theme-toggle" 
                    aria-label="Toggle dark mode"
                    title="Toggle dark mode"
                >
                    <span class="theme-icon sun" aria-hidden="true">☀️</span>
                    <span class="theme-icon moon" aria-hidden="true">🌙</span>
                </button>
            </div>
            <p class="subtitle">Organize your day, one task at a time</p>
        </header>

        <main>
            <section class="task-input" aria-label="Add new task">
                <form id="task-form" role="form">
                    <div class="input-group">
                        <label for="task-input" class="visually-hidden">Enter a new task</label>
                        <input 
                            type="text" 
                            id="task-input" 
                            placeholder="What needs to be done?" 
                            autocomplete="off"
                            aria-describedby="input-hint"
                            required
                        >
                        <div class="due-date-group">
                            <label for="due-date-input" class="visually-hidden">Due date (optional)</label>
                            <input 
                                type="date" 
                                id="due-date-input" 
                                aria-label="Due date (optional)"
                            >
                        </div>
                        <div class="due-time-group">
                            <label for="due-time-input" class="visually-hidden">Due time (optional)</label>
                            <select id="due-time-input" aria-label="Due time (optional)">
                                <option value="">Time</option>
                                <option value="00:00">00:00</option>
                                <option value="00:30">00:30</option>
                                <option value="01:00">01:00</option>
                                <option value="01:30">01:30</option>
                                <option value="02:00">02:00</option>
                                <option value="02:30">02:30</option>
                                <option value="03:00">03:00</option>
                                <option value="03:30">03:30</option>
                                <option value="04:00">04:00</option>
                                <option value="04:30">04:30</option>
                                <option value="05:00">05:00</option>
                                <option value="05:30">05:30</option>
                                <option value="06:00">06:00</option>
                                <option value="06:30">06:30</option>
                                <option value="07:00">07:00</option>
                                <option value="07:30">07:30</option>
                                <option value="08:00">08:00</option>
                                <option value="08:30">08:30</option>
                                <option value="09:00">09:00</option>
                                <option value="09:30">09:30</option>
                                <option value="10:00">10:00</option>
                                <option value="10:30">10:30</option>
                                <option value="11:00">11:00</option>
                                <option value="11:30">11:30</option>
                                <option value="12:00">12:00</option>
                                <option value="12:30">12:30</option>
                                <option value="13:00">13:00</option>
                                <option value="13:30">13:30</option>
                                <option value="14:00">14:00</option>
                                <option value="14:30">14:30</option>
                                <option value="15:00">15:00</option>
                                <option value="15:30">15:30</option>
                                <option value="16:00">16:00</option>
                                <option value="16:30">16:30</option>
                                <option value="17:00">17:00</option>
                                <option value="17:30">17:30</option>
                                <option value="18:00">18:00</option>
                                <option value="18:30">18:30</option>
                                <option value="19:00">19:00</option>
                                <option value="19:30">19:30</option>
                                <option value="20:00">20:00</option>
                                <option value="20:30">20:30</option>
                                <option value="21:00">21:00</option>
                                <option value="21:30">21:30</option>
                                <option value="22:00">22:00</option>
                                <option value="22:30">22:30</option>
                                <option value="23:00">23:00</option>
                                <option value="23:30">23:30</option>
                            </select>
                        </div>
                        <div class="effort-group">
                            <label for="effort-input" class="visually-hidden">Level of effort in hours (optional)</label>
                            <input 
                                type="number" 
                                id="effort-input" 
                                placeholder="Hours"
                                min="0.5"
                                max="100"
                                step="0.5"
                                aria-label="Level of effort in hours (optional)"
                            >
                        </div>
                        <button type="submit" id="add-btn" aria-label="Add task">
                            <span class="btn-icon" aria-hidden="true">+</span>
                            <span class="btn-text">Add Task</span>
                        </button>
                    </div>
                    <p id="input-hint" class="hint">Press Enter or click Add Task to add</p>
                </form>
            </section>

            <section class="task-filters" aria-label="Filter tasks">
                <div class="filter-group" role="group" aria-label="Task filters">
                    <button class="filter-btn active" data-filter="all" aria-pressed="true">
                        All <span class="count" id="count-all">0</span>
                    </button>
                    <button class="filter-btn" data-filter="active" aria-pressed="false">
                        Active <span class="count" id="count-active">0</span>
                    </button>
                    <button class="filter-btn" data-filter="completed" aria-pressed="false">
                        Completed <span class="count" id="count-completed">0</span>
                    </button>
                </div>
            </section>

            <section class="past-due-section hidden collapsible-section" aria-label="Past due tasks" id="past-due-section">
                <button class="section-title" aria-expanded="true" aria-controls="past-due-list">
                    <span class="section-icon" aria-hidden="true">⚠️</span>
                    <span class="section-label">Past Due</span>
                    <span class="count" id="count-past-due">0</span>
                    <span class="collapse-icon" aria-hidden="true">▼</span>
                </button>
                <ul id="past-due-list" class="task-list section-content" role="list" aria-live="polite">
                    <!-- Past due tasks will be dynamically added here -->
                </ul>
            </section>

            <section class="due-today-section hidden collapsible-section" aria-label="Tasks due today" id="due-today-section">
                <button class="section-title" aria-expanded="true" aria-controls="due-today-list">
                    <span class="section-icon" aria-hidden="true">📅</span>
                    <span class="section-label">Due Today</span>
                    <span class="count" id="count-due-today">0</span>
                    <span class="collapse-icon" aria-hidden="true">▼</span>
                </button>
                <ul id="due-today-list" class="task-list section-content" role="list" aria-live="polite">
                    <!-- Tasks due today will be dynamically added here -->
                </ul>
            </section>

            <section class="upcoming-section hidden collapsible-section" aria-label="Upcoming tasks" id="upcoming-section">
                <button class="section-title" aria-expanded="true" aria-controls="upcoming-list">
                    <span class="section-icon" aria-hidden="true">🗓️</span>
                    <span class="section-label">Upcoming</span>
                    <span class="count" id="count-upcoming">0</span>
                    <span class="collapse-icon" aria-hidden="true">▼</span>
                </button>
                <ul id="upcoming-list" class="task-list section-content" role="list" aria-live="polite">
                    <!-- Upcoming tasks will be dynamically added here -->
                </ul>
            </section>

            <section class="completed-section hidden collapsible-section" aria-label="Completed tasks" id="completed-section">
                <button class="section-title" aria-expanded="true" aria-controls="completed-list">
                    <span class="section-icon" aria-hidden="true">✅</span>
                    <span class="section-label">Completed</span>
                    <span class="count" id="count-completed-section">0</span>
                    <span class="collapse-icon" aria-hidden="true">▼</span>
                </button>
                <ul id="completed-list" class="task-list section-content" role="list" aria-live="polite">
                    <!-- Completed tasks will be dynamically added here -->
                </ul>
            </section>

            <section class="task-list-section" aria-label="Task list">
                <ul id="task-list" class="task-list" role="list" aria-live="polite">
                    <!-- Tasks will be dynamically added here -->
                </ul>
                <div id="empty-state" class="empty-state" aria-live="polite">
                    <div class="empty-icon" aria-hidden="true">📋</div>
                    <p>No tasks yet. Add one above!</p>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Task Manager. Built with accessibility in mind.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
